global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Metrik GPU (DCGM). Alamat target ada di targets/dcgm.yml (ditulis ulang oleh install.sh
  # sesuai mode dcgm-exporter). Label instance diseragamkan ke nama node.
  - job_name: dcgm
    file_sd_configs:
      - files: ['/etc/prometheus/targets/dcgm.yml']
    relabel_configs:
      - target_label: instance
        replacement: dgx-b300

  # Metrik host (CPU, RAM, disk, network, InfiniBand). node-exporter jalan di network host.
  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node.yml']
    relabel_configs:
      - target_label: instance
        replacement: dgx-b300
